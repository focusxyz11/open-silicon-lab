name: Propose a question
description: An open question for a place in the dive, in a data centre, a phone or a car, at any depth down to the atom.
title: "[Question] "
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        A good question has no simple answer and makes you look at something in the scene. Rough ideas are welcome: others can sharpen them here. The site fills in the place for you when you come from it.
  - type: input
    id: where
    attributes:
      label: Where in the dive
      placeholder: "for example, Phone: Chip"
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: The part of the scene it is about
      placeholder: for example, the memory beside the chip
  - type: input
    id: continues
    attributes:
      label: The question it follows on from (optional)
      description: If you came here following a question, it is filled in for you.
  - type: textarea
    id: question
    attributes:
      label: The question
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Something true to notice (not the answer), with a source if it has a number
