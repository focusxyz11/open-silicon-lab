name: Something is broken
description: A page, button or simulation that does not work or looks wrong.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Page address
      description: Copy the address from your browser, for example .../open-silicon-lab/#litho
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead? A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example iPhone 15 Safari, or Windows Chrome.
