name: Add a view to an open problem
description: An answer people give to one of the lab's open problems, or a new open problem.
title: "[View] "
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Open problems are where informed people disagree. Write the view the way its best defender would, and say what it assumes. The lab never marks a view right: readers weigh them and test them with challenges.
  - type: input
    id: wall
    attributes:
      label: Open problem
      description: One of the walls on the Open problems page, for example The memory wall, or a new one.
    validations:
      required: true
  - type: input
    id: view
    attributes:
      label: The view, in a few words
      description: For example "Stack it closer".
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What it claims
      description: One or two sentences, as its strongest supporter would say it.
    validations:
      required: true
  - type: textarea
    id: assumes
    attributes:
      label: What it assumes
      description: The thing that has to be true for this view to win.
    validations:
      required: true
  - type: input
    id: topics
    attributes:
      label: Topics that test it
      description: Topic ids from page addresses, for example package, datacenter.
  - type: textarea
    id: sources
    attributes:
      label: Sources (optional)
      description: Who argues this, with links.
