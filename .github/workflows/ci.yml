name: Test and deploy

# A pull request runs the whole suite once it is ready for review (a draft waits). A push to main does not test again:
# the ruleset lets a branch in only when it is up to date with main and its `test` is green, so the commit on main is
# the one that was tested; it goes straight to the site. The full suite still runs on main every night (schedule) and
# whenever it is started by hand (workflow_dispatch), as a safety net.
# A pull request is tested by its lane (job `plan`, scripts/ci-plan.mjs, docs/WORKFLOW.md "CI's lanes"): words and
# documents alone run the logic and words tests; the files of known views run those tests and only their sections;
# anything else runs everything, as does the label ci:full. Never filter the workflow by paths: `test` must always report.
on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding ci:full runs the whole suite again
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

# a newer push to the same pull request replaces the run still going for the older one; runs on main always finish, and
# the nightly safety run has a queue of its own, so it never holds up or replaces a deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # what this run tests: the lane of the files a pull request changes (nothing on a push to main or on a draft; everything
  # by hand, every night, or with the label ci:full)
  plan:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      logic: ${{ steps.plan.outputs.logic }}
      browser: ${{ steps.plan.outputs.browser }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request is checked out as its merge into main: HEAD^1 is main, so HEAD^1..HEAD is what it changes
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        name: Sort the change into a lane
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          # The browser smoke test runs in sections (node scripts/smoke.mjs --list), in groups side by side: one long run
          # on the software renderer took about 20 minutes and starved its own late 3D checks. Groups are balanced by the
          # time each section takes here (every run prints "Section <name>: <s> s"); seconds per section on CI
          # (2026-11-18): labs 102, explore-desktop 87, explore-phone 69, flights 61, joins 58, motion 40, break 25,
          # ways 25, frame 17, seams 15, search 13, old 4, slow 4. Every section is in exactly one group but those
          # waiting in NOT_IN_CI (scripts/smoke/owners.mjs; stack, #489), and a lane runs only the groups and sections it
          # needs (tests/owners.test.mjs).
          CI_GROUPS: |
            explore desktop: explore-desktop,frame,search,old,home
            explore phone: explore-phone,flights,break,slow,stations
            motion: motion,joins,seams,blueprint
            labs and ways: labs,ways,machines
        run: |
          if [ "$EVENT" = pull_request ]; then git diff --name-only HEAD^1 HEAD; fi > changed.txt
          echo "Changed files: $(wc -l < changed.txt)"; cat changed.txt
          node scripts/ci-plan.mjs < changed.txt

  logic:
    name: logic and words
    needs: plan
    if: needs.plan.outputs.logic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic and words tests
        run: npm test
      # the tests do not load every file (src/v2/app.js, src/v2/glue/), and a lane may skip the browser: node at least
      # reads every script whole
      - name: Every script parses
        run: git ls-files '*.js' '*.mjs' | grep -v '^src/vendor/' | xargs -n 50 -P 4 sh -c 'for f; do node --check "$f" || exit 1; done' _

  # the groups the plan chose, each with only the sections its lane needs
  browser:
    name: browser (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the browser and npm's downloads are kept between runs; Playwright's version is pinned here and in the key
      - name: Keep the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: playwright-1.48.2-chromium-${{ runner.os }}
      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          # The runner image already has most system libraries; if Ubuntu's package servers cannot be
          # reached, install only the browser (from Playwright's own servers) and go on.
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Browser smoke test (${{ matrix.sections }})
        # the browser runs on a software renderer here, seconds per frame: if one run fails, it runs once more, and a pass
        # on the second run is marked as a warning, so a check that passes by chance is still seen and fixed
        timeout-minutes: 60
        run: |
          if npm run test:browser -- --only "${{ matrix.sections }}"; then exit 0; fi
          echo "::warning title=Smoke test (${{ matrix.group }}) passed only on a second run::A browser check failed once. Read the first run's problems above and make that check steady."
          npm run test:browser -- --only "${{ matrix.sections }}"

  # the one check pull requests and the nightly build look for: green only when the plan ran, every part it chose
  # passed and every part it left out was skipped. On a draft it is skipped (a draft cannot merge; marking it ready for
  # review starts a run). On a push to main it passes at once: that commit was tested in its pull request.
  test:
    name: test
    if: always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    needs: [plan, logic, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Every part the plan chose passed
        env:
          EVENT: ${{ github.event_name }}
          PLAN: ${{ needs.plan.result }}
          LANE: ${{ needs.plan.outputs.lane }}
          WANT_LOGIC: ${{ needs.plan.outputs.logic }}
          WANT_BROWSER: ${{ needs.plan.outputs.browser }}
          LOGIC: ${{ needs.logic.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "plan: $PLAN (lane $LANE), logic and words: $LOGIC (wanted: $WANT_LOGIC), browser: $BROWSER (wanted: $WANT_BROWSER)"
          if [ "$EVENT" = push ]; then
            echo "A push to main: this commit was tested in its pull request (up to date and green before merging)."
            exit 0
          fi
          test "$PLAN" = success || { echo "The plan did not finish."; exit 1; }
          if [ "$WANT_LOGIC" = true ]; then test "$LOGIC" = success; else test "$LOGIC" = skipped; fi
          if [ "$WANT_BROWSER" = true ]; then test "$BROWSER" = success; else test "$BROWSER" = skipped; fi

  # the site is collected and uploaded in one job and deployed in the next: deploy-pages run in the same job, a
  # moment after the upload, finds no artifact (actions/deploy-pages#451; every deploy failed so from 23 November)
  # if deploying still finds nothing, it waits 30 s and tries once more
  # deployed on a push to main or by hand, never from the nightly safety run; !cancelled() because the jobs before test
  # are skipped on a push, which would otherwise skip this job too
  site:
    if: ${{ !cancelled() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        # the ledger's entries (community/ledger/, one file each) become the one list the site reads
        # and the framework's own pages (docs/framework: its map and its sketch), which no page of the site links to
        run: mkdir _site && cp -r index.html classic.html explore.html src assets _site/ && cp -r docs/framework _site/framework && cp -r content _site/content && node scripts/ledger.mjs _site/community/ledger.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before trying once more
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning title=Pages::Publishing found no artifact on the first try; trying once more in 30 s."
          sleep 30
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
