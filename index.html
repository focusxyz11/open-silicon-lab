<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open Silicon Lab</title>
<meta name="description" content="An open-source, hands-on lab for how chips are designed, made and used for AI: a connected map of the whole chip stack with 50+ live simulations, a RISC-V CPU lab and a tiny-chip studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/riscv.css">
<link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
<header class="topbar">
  <div class="in">
    <a class="brand" href="#map">Open <span>Silicon</span> Lab</a>
    <nav class="tabs" id="nav" aria-label="Main">
      <a href="#map" data-v="map">Map</a>
      <a href="#workshop" data-v="workshop">Workshop</a>
      <a href="#challenges" data-v="challenges">Challenges</a>
      <a href="#knowledge" data-v="knowledge">Knowledge</a>
    </nav>
    <div class="tools">
      <div class="modeseg" role="group" aria-label="Explanation level"><button type="button" data-m="beginner">Beginner</button><button type="button" data-m="engineer">Engineer</button></div>
      <a class="prog" href="#map" id="progTop" aria-label="Topics explored"><i></i><span>0/21 explored</span></a>
    </div>
  </div>
</header>

<div class="view" id="view-map"></div>

<div class="wrap layout view" id="view-topic" hidden>
  <nav class="rail" id="rail" aria-label="In this topic"></nav>
  <main id="library">
    <div class="tophead" id="topicHead"></div>
    <p class="loading" id="loading">Loading the lab…</p>
  </main>
</div>

<div class="view" id="view-workshop" hidden></div>
<div class="view" id="view-challenges" hidden></div>
<div class="view" id="view-knowledge" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
