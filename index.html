<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open Silicon Lab</title>
<meta name="description" content="An open-source, hands-on lab for how chips are designed, made and used everywhere, from phones and cars to AI data centers: a connected map of the whole chip stack with 50+ live simulations, a RISC-V CPU lab and a tiny-chip studio.">
<meta name="theme-color" content="#0C1318">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Open Silicon Lab">
<meta property="og:title" content="Open Silicon Lab: how chips are made, by playing">
<meta property="og:description" content="A free, open-source lab: over 70 simulations from atoms to the chips in phones, cars and AI data centers, a RISC-V CPU lab, and a studio to design a tiny chip yourself.">
<meta property="og:url" content="https://focusxyz11.github.io/open-silicon-lab/">
<meta property="og:image" content="https://focusxyz11.github.io/open-silicon-lab/assets/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Open Silicon Lab: a map of the chip stack from atoms to innovation, with connected topics">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
<header class="topbar">
  <div class="in">
    <a class="brand" href="#map">Open <span>Silicon</span> Lab</a>
    <nav class="tabs" id="nav" data-i18n-attr="aria-label:nav.label">
      <a href="#map" data-v="map" data-i18n="nav.map"></a>
      <a href="#workshop" data-v="workshop" data-i18n="nav.workshop"></a>
      <a href="#challenges" data-v="challenges" data-i18n="nav.challenges"></a>
      <a href="#knowledge" data-v="knowledge" data-i18n="nav.knowledge"></a>
      <a href="#mychip" data-v="mychip" data-i18n="nav.mychip"></a>
    </nav>
    <div class="tools">
      <div class="modeseg" role="group" data-i18n-attr="aria-label:mode.label"><button type="button" data-m="beginner" data-i18n="mode.beginner"></button><button type="button" data-m="engineer" data-i18n="mode.engineer"></button></div>
      <a class="prog" href="#map" id="progTop" data-i18n-attr="aria-label:progress.label"><i></i><span></span></a>
    </div>
  </div>
</header>

<div class="view" id="view-map"></div>

<div class="wrap layout view" id="view-topic" hidden>
  <nav class="rail" id="rail" data-i18n-attr="aria-label:topic.railLabel"></nav>
  <main id="library">
    <div class="tophead" id="topicHead"></div>
    <p class="loading" id="loading">Loading the lab…</p><!-- shown before the texts load; replaced by boot.loading -->
  </main>
</div>

<div class="view" id="view-workshop" hidden></div>
<div class="view" id="view-challenges" hidden></div>
<div class="view" id="view-knowledge" hidden></div>
<div class="view" id="view-mychip" hidden></div>

<footer class="sitefoot" id="siteFoot">
  <div class="wrap">
    <div>
      <p class="brand">Open <span>Silicon</span> Lab</p>
      <p class="small" data-i18n="foot.about"></p>
    </div>
    <nav class="footlinks" data-i18n-attr="aria-label:foot.label">
      <a data-issue="correction" href="#" data-i18n="foot.mistake"></a>
      <a data-issue="idea" href="#" data-i18n="foot.idea"></a>
      <a data-issue="bug" href="#" data-i18n="foot.bug"></a>
      <a data-repo="" href="#" data-i18n="foot.source"></a>
      <a href="#map" data-guide-start data-i18n="foot.tour"></a>
      <a href="#map" data-hints-reset data-i18n="foot.hints"></a>
      <a href="#sources" data-i18n="foot.sources"></a>
    </nav>
  </div>
</footer>

<!-- Topic simulations import shared code as osl/…, which maps to src/ (see topics/README.md). -->
<script type="importmap">{"imports":{"osl/":"./src/"}}</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
