<!doctype html>
<html lang="en" class="frame2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open Silicon Lab</title>
<meta name="description" content="Explore where chips are born, made and used, and the open questions behind them.">
<meta name="theme-color" content="#0b1120">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap">
<link rel="stylesheet" href="src/styles/base.css" data-css="base">
<link rel="stylesheet" href="src/styles/hold.css" data-css="hold">
<script>try { var th = localStorage.getItem('osl-theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
</head>
<body>
<div class="v2" id="v2">
  <header class="bar">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span><b data-i18n="ui.lab"></b></a>
    <nav class="loop" id="loop" data-i18n-attr="aria-label:loop.aria"></nav>
    <button type="button" class="round breakbtn" id="breakbtn" aria-haspopup="dialog" aria-controls="breakp"><span aria-hidden="true">⚑</span></button>
    <a class="logbtn" id="logbtn" href="#/log"></a>
    <button type="button" class="round" id="theme"><span aria-hidden="true">◐</span></button>
  </header>
  <section class="breakp" id="breakp" role="dialog" aria-modal="false" hidden></section>
  <main class="stage" id="stage">
    <canvas class="c3" id="mapCanvas" tabindex="0" data-i18n-attr="aria-label:map.aria"></canvas>
    <canvas class="c3" id="placeCanvas" tabindex="0" hidden data-i18n-attr="aria-label:place.aria"></canvas>
    <canvas class="c3" id="flyCanvas" tabindex="0" hidden data-i18n-attr="aria-label:place.aria"></canvas>
    <canvas class="c3" id="carCanvas" tabindex="0" hidden data-i18n-attr="aria-label:place.aria"></canvas>
    <canvas class="c3" id="studioCanvas" tabindex="0" hidden data-i18n-attr="aria-label:place.aria"></canvas>
    <canvas class="c3 dive2" id="diveCanvas" tabindex="0" hidden data-i18n-attr="aria-label:dive.aria"></canvas>
    <canvas class="c3" id="boardCanvas" tabindex="0" hidden data-i18n-attr="aria-label:board.aria"></canvas>
    <canvas class="c3" id="chipCanvas" tabindex="0" hidden data-i18n-attr="aria-label:chipx.aria"></canvas>
    <div class="labels" id="mapLabels"></div>
    <div class="labels" id="placeLabels" hidden></div>
    <div class="labels" id="flyLabels" hidden></div>
    <div class="labels" id="carLabels" hidden></div>
    <div class="labels" id="studioLabels" hidden></div>
    <div class="labels" id="chipLabels" hidden></div>
    <div class="labels" id="boardLabels" hidden></div>
    <div class="labels" id="flatLabels" hidden></div>
    <a class="homebtn" id="outbtn" href="#/ecosystem" hidden data-i18n-attr="title:loop.out"><span aria-hidden="true">↑</span><span class="ol" data-i18n="loop.outShort"></span></a>
    <section class="hero" id="hero" hidden></section>
    <section class="placeui" id="placeui" hidden></section>
    <section class="placeui" id="flyui" hidden></section>
    <section class="placeui" id="carui" hidden></section>
    <section class="placeui" id="studioui" hidden></section>
    <section class="chipui" id="chipui" hidden></section>
    <section class="boardui" id="boardui" hidden></section>
    <section class="boardui" id="diveui" hidden></section>
    <section class="home" id="home" hidden data-i18n-attr="aria-label:ui.hold"></section>
    <section class="home" id="blueprint" hidden data-i18n-attr="aria-label:ui.blueprint"></section>
    <section class="home" id="stations" hidden data-i18n-attr="aria-label:home.aria"></section>
    <section class="page" id="page" hidden></section>
    <aside class="sheet" id="sheet" hidden aria-live="polite"></aside>
    <div class="loading" id="loading"><span></span></div>
    <div class="toast" id="toast" hidden role="status"></div>
  </main>
</div>
<noscript><p style="padding:24px">Open Silicon Lab is interactive and needs JavaScript to run.</p></noscript>
<script type="module" src="src/main2.js"></script>
</body>
</html>
