<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,600;0,700;1,400&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap">
<style>/* Your stack. The lab's ground and ink, night or day; Besley for names and questions, Atkinson for words, Martian Mono
   drawn narrow for figures. The picture is the page: words over it are glass, controls on it stay square and drafted. */
:root{color-scheme:light dark;
 --bg:light-dark(#dfe8f2,#0b1120);--panel:light-dark(rgba(255,255,255,.84),rgba(16,23,38,.82));--solid:light-dark(#fff,#111a2b);
 --line:light-dark(rgba(40,60,90,.2),rgba(160,180,210,.22));--ink:light-dark(#16202e,#eef2f8);--muted:light-dark(#5b6a80,#9aa8bd);
 --accent:light-dark(#2f7de1,#5aa9ff);--on-accent:light-dark(#fff,#06101f);--bad:light-dark(#d8403a,#ff6b62);--warm:light-dark(#b86f0c,#ffb347);
 --sans:"Atkinson Hyperlegible Next",system-ui,sans-serif;--serif:"Besley",Georgia,serif;--mono:"Martian Mono",ui-monospace,Menlo,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{background-image:radial-gradient(120% 90% at 50% 40%,transparent 55%,light-dark(rgba(40,60,90,.1),rgba(0,0,0,.35)))}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;left:8px;top:64px;display:flex;flex-direction:column;gap:2px;z-index:5}
.sr button{position:absolute;opacity:0;pointer-events:none;white-space:nowrap;background:var(--solid);border:1px solid var(--line);padding:4px 8px;border-radius:4px;font-size:13px}
.sr button:focus-visible{opacity:1;position:static}
#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* the picture fades under the bar and the dock, so words there stay clear */
body::before,body::after{content:"";position:fixed;left:0;right:0;z-index:6;pointer-events:none}
body::before{top:0;height:96px;background:linear-gradient(var(--bg) 38%,transparent)}
body::after{bottom:0;height:150px;background:linear-gradient(transparent,var(--bg) 62%)}

/* the bar: where you are, and how far out you stand */
#bar{position:fixed;z-index:20;top:0;left:0;right:0;height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 20px;pointer-events:none}
#bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--muted);font:500 13px/1 var(--sans);white-space:nowrap;justify-self:start}
.logo{width:22px;height:22px;flex:none}.logo .fr{fill:none;stroke:#e5401a;stroke-width:5}.logo .cut{fill:none;stroke:var(--ink);stroke-width:4}.logo .cell{fill:#e5401a}
#ttl{position:absolute;left:20px;top:50px;margin:0;font:700 clamp(22px,2.2vw,34px)/1 var(--serif);letter-spacing:-.005em;pointer-events:none}
#rail{position:relative;display:grid;grid-template-columns:repeat(3,minmax(96px,150px));padding-bottom:9px}
#rail::after{content:"";position:absolute;left:16.6%;right:16.6%;bottom:3px;border-top:1px solid var(--line)}
#rail button{background:none;border:0;padding:8px 6px 6px;font:500 13.5px/1.1 var(--sans);color:var(--muted);text-align:center;white-space:nowrap}
#rail button:hover{color:var(--ink)}#rail button.on{color:var(--ink);font-weight:700}
#pin{position:absolute;bottom:0;width:7px;height:7px;margin-left:-3.5px;background:var(--accent);transform:rotate(45deg);transition:left .5s cubic-bezier(.3,.8,.3,1);z-index:1}
.tools{justify-self:end;display:flex;align-items:center;gap:14px}
.lnk{background:none;border:0;padding:6px 0;font:500 13px/1 var(--sans);color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--accent)}
.fidb{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 9px;font:400 11.5px/1 var(--mono);font-stretch:80%;color:var(--muted)}
.g{display:inline-flex;align-items:flex-end;gap:1.5px;height:11px}.g u{width:2.5px;border:1px solid currentColor;opacity:.5}.g u:nth-child(1){height:4px}.g u:nth-child(2){height:6px}.g u:nth-child(3){height:8.5px}.g u:nth-child(4){height:11px}
.g1 u:nth-child(-n+1),.g2 u:nth-child(-n+2),.g3 u:nth-child(-n+3){background:currentColor;opacity:1}.fidb:hover{color:var(--ink);border-color:var(--muted)}
.round{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center}.round:hover{border-color:var(--muted)}

/* buttons: square and drafted */
.btn{border:1px solid var(--line);background:var(--solid);border-radius:6px;padding:0 14px;min-height:40px;font:600 14px/1 var(--sans);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.4}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.pri:hover:not(:disabled){filter:brightness(1.08)}

/* the forks, beside the rungs each gene chooses */
#genes{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .25s}
#genes.on{opacity:1}
.gene{position:absolute;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.gene span{font:400 12px/1.25 var(--sans);color:var(--muted);text-wrap:balance}
.way{pointer-events:none;border:1px solid var(--accent);background:color-mix(in srgb,var(--bg) 82%,transparent);color:var(--accent);border-radius:4px;padding:7px 24px 7px 11px;font:700 14.5px/1.1 var(--sans);position:relative;text-align:left;max-width:100%}
#genes.on .way{pointer-events:auto}
.way::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg)}
.way:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.way.forked{background:var(--accent);color:var(--on-accent)}
.way:disabled{border-color:var(--line);color:var(--ink);padding-right:11px}.way:disabled::after{display:none}.way.forked:disabled{background:none;border-color:var(--muted)}
#pop{position:fixed;z-index:40;background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 18px 50px light-dark(rgba(30,50,80,.2),rgba(0,0,0,.5));display:grid;gap:2px}
#pop p{margin:6px 10px;font-size:12.5px;color:var(--bad)}
#pop button{display:grid;grid-template-columns:1fr auto;gap:1px 12px;text-align:left;border:0;background:none;border-radius:6px;padding:9px 10px}
#pop button:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
#pop button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
#pop b{font:700 15px/1.2 var(--sans)}#pop span{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.3}
#pop .fx{font:400 11px/1.4 var(--mono);font-stretch:80%;color:var(--ink)}
#pop em{grid-row:1;grid-column:2;font:400 11px/1.6 var(--mono);font-stretch:80%;font-style:normal;color:var(--muted);text-align:right}
#pop button:disabled{opacity:.5}

/* the questions, where they bite */
#marks{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .25s}#marks.on{opacity:1}
#marks button{position:absolute;transform:translate(-13px,-50%);pointer-events:none;display:inline-flex;align-items:center;gap:0;border:0;border-radius:999px;background:none;color:var(--warm);padding:4px;font:500 12.5px/1 var(--sans);min-height:26px;white-space:nowrap}
#marks.on button{pointer-events:auto}
#marks i{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;background:color-mix(in srgb,var(--bg) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--warm) 18%,transparent);animation:pulse 2.6s ease-in-out infinite;flex:none}
#marks span{max-width:0;overflow:hidden;opacity:0;transition:max-width .25s,opacity .2s,padding .25s}
#marks button:hover,#marks button:focus-visible,#marks button[aria-pressed=true]{background:color-mix(in srgb,var(--bg) 90%,transparent);box-shadow:inset 0 0 0 1px var(--warm);z-index:2}
#marks button:hover span,#marks button:focus-visible span,#marks button[aria-pressed=true] span{max-width:220px;opacity:1;padding:0 9px 0 7px}
#marks button.dim{opacity:.3}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
#lens{position:fixed;z-index:30;width:min(440px,calc(100vw - 28px));background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--warm);border-radius:14px;padding:18px 20px 16px}
#lens q{display:block;quotes:none;font:italic 400 21px/1.34 var(--serif);text-wrap:pretty}
#lens p{margin:10px 0 14px;font-size:15px;line-height:1.45;color:var(--ink)}
#lens .btn{min-height:36px}

/* the opened rung's controls, under its plate */
#ctl{position:fixed;z-index:10;opacity:0;transition:opacity .25s;pointer-events:none;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;justify-content:center;padding:4px 0}
#ctl.on{opacity:1;pointer-events:auto}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lbl{font:400 12.5px/1.2 var(--sans);color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);margin-left:-1px;padding:0 12px;min-height:38px;font:500 13.5px/1 var(--sans)}
.seg button:first-child{border-radius:5px 0 0 5px;margin-left:0}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button:hover:not(:disabled){border-color:var(--accent);position:relative;z-index:1}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);position:relative;z-index:1}
.seg button:disabled{opacity:.35}
#ctl input[type=range]{width:min(300px,48vw);accent-color:var(--accent);height:30px}
#ctl output{font:500 13.5px/1 var(--mono);font-stretch:80%;min-width:54px}
#ctl .warn,#ctl .quiet{flex-basis:100%;text-align:center;margin:0;font-size:13.5px;color:var(--bad)}#ctl .quiet{color:var(--muted)}
.forks a{font:500 13px/1 var(--sans);color:var(--accent);text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);padding:6px 0}
#ctl .done{display:none}

/* another recipe's sketch */
#card{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;width:100%;min-height:76px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
#card span{font-size:15px}
body.sketch #dock{display:none}

/* one line of what just happened */
#foot{position:fixed;z-index:15;left:50%;bottom:12px;transform:translateX(-50%);width:min(1240px,calc(100vw - 24px));display:grid;gap:8px;justify-items:center;pointer-events:none}#foot>*{pointer-events:auto}
#say{margin:0;max-width:min(900px,100%);min-height:22px;text-align:center;font:400 15px/1.4 var(--sans);color:var(--ink);text-wrap:balance;pointer-events:none;text-shadow:0 0 12px var(--bg),0 0 4px var(--bg)}
#say.in{animation:say .5s ease-out}
@keyframes say{from{opacity:0;transform:translateY(6px)}}

/* the agents' forks: a hand of cards over the dock */
#cards{display:grid;gap:8px;justify-items:center;max-width:100%}
#cards p{margin:0;font-size:14px;text-align:center;text-shadow:0 0 12px var(--bg),0 0 4px var(--bg)}#cards p .lnk{margin-left:8px;font-size:14px}
.hand{display:flex;gap:10px;align-items:stretch;max-width:100%}
.prop{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;width:220px;align-content:start;animation:say .35s ease-out backwards}
.prop:nth-child(2){animation-delay:.07s}.prop:nth-child(3){animation-delay:.14s}
.prop .k,.prop span{font-size:12.5px;color:var(--muted);line-height:1.3}.prop b{font:700 18px/1.15 var(--serif)}
.prop .n{color:var(--ink)}.prop .lose{color:var(--bad)}.prop .btn{margin-top:6px;min-height:32px}
.prop.none{width:auto;grid-auto-flow:column;align-items:center;gap:14px}.prop.none .btn{margin:0}
body.cards #say{display:none}

/* the dock: time. Where this year's attempts go, and a year at a time */
#dock{width:100%;min-height:76px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:9px 10px 9px 18px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px}
.clock{display:grid;gap:3px;width:206px}.clock b{font:700 19px/1.05 var(--serif);white-space:nowrap}
.clock span{font:400 11px/1.3 var(--mono);font-stretch:80%;color:var(--muted);text-wrap:balance}
.clock .lnk{justify-self:start;padding:1px 0;font-size:12px}
.dirs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.dirs button{position:relative;display:grid;gap:5px;text-align:left;border:1px solid var(--line);background:none;border-radius:6px;padding:8px 8px 7px;min-height:58px;align-content:center}
.dirs .nm{font:500 13px/1 var(--sans);white-space:nowrap}.dirs .v{font:400 11px/1 var(--mono);font-stretch:78%;color:var(--muted)}
.dirs .bar{height:4px;background:color-mix(in srgb,var(--ink) 12%,transparent)}.dirs .bar i{display:block;height:100%;background:var(--ink);transition:width .5s}
.dirs button:hover:not(:disabled){border-color:var(--accent)}
.dirs button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}.dirs button[aria-pressed=true] .bar i{background:var(--accent)}
.dirs button.sug::after{content:"";position:absolute;top:-4px;left:50%;width:6px;height:6px;margin-left:-3px;background:var(--accent);transform:rotate(45deg)}
.dirs button:disabled{opacity:.55}
#more{display:none}
.go{display:flex;gap:6px}.ag{display:grid;gap:4px}.ag .btn{min-height:27px;font-size:12.5px;font-weight:500;padding:0 10px}

@media (max-width:1320px){.dirs .nm{font-size:12px}.dirs button{padding:8px 6px 7px}.clock{width:190px}.clock b{font-size:17.5px}.go .btn{padding:0 11px;font-size:13.5px}.brand span{display:none}#dock{gap:10px}}
@media (max-width:759px){
 #bar{height:auto;padding:10px 12px 0;grid-template-columns:auto 1fr auto;gap:6px 10px}#ttl{position:static;font-size:20px;white-space:nowrap}.brand span,.fidb,#reset{display:none}
 #rail{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(3,1fr);justify-self:stretch}#rail button{font-size:12.5px;padding:6px 4px}
 .tools{grid-column:3;grid-row:1}.round{width:32px;height:32px}
 #foot{bottom:8px;width:calc(100vw - 16px);gap:6px}
 #dock{grid-template-columns:1fr auto;gap:8px;padding:8px 8px 8px 12px;min-height:0}
 .clock{width:auto}.clock b{font-size:16.5px;white-space:normal}.clock span{display:none}.go .btn{padding:0 9px;font-size:13px;min-height:38px}#grow5{display:none}#more{display:block}
 .dirs,.ag{display:none}
 body.more .dirs{display:grid;grid-column:1/-1;grid-template-columns:repeat(3,1fr);gap:4px}body.more .dirs button{min-height:44px;padding:6px 8px}
 body.more .ag{display:flex;grid-column:1/-1;gap:4px}.ag .btn{flex:1;min-height:36px}body.more .clock span{display:block}body.more #grow5{display:block}
 #say{font-size:13.5px;min-height:38px;display:grid;align-items:end}#cards{width:100%}.hand{flex-direction:column;width:100%}#cards p{font-size:13px}.prop{width:auto;grid-template-columns:1fr auto;padding:9px 12px}.prop .btn{grid-row:1/4;grid-column:2;margin:0;align-self:center}.prop .k{display:none}
 #card{min-height:0;padding:10px}#card span{flex-basis:100%;text-align:center;font-size:13.5px}
 body[data-level=rung]:not(.sketch) #foot{display:none}
 #ctl{left:8px;right:8px;bottom:8px;top:auto;justify-content:flex-start;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:46vh;overflow:auto;gap:10px}
 #ctl .row{flex-basis:100%}#ctl .lbl{flex-basis:100%}.seg button{min-height:40px;padding:0 10px;font-size:13px}#ctl .done{display:block;margin-left:auto}
 #lens{left:8px;right:8px;bottom:8px;width:auto;z-index:35}#lens q{font-size:18px}
 body::before{height:104px;background:linear-gradient(var(--bg) 72%,transparent)}body::after{height:170px}
}
@media (min-width:2200px){#bar,#foot,#pop,#lens{zoom:1.25}#foot{width:min(1240px,calc(80vw - 24px))}.gene span{font-size:14px}.way{font-size:17px;padding:9px 28px 9px 13px}#marks i{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-level="field">
<canvas id="world" role="img"></canvas>
<header id="bar">
  <a class="brand" href="https://focusxyz11.github.io/open-silicon-lab/"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40" class="fr"/><path d="M24 4v40M4 24h20M34 4v20M24 14h10" class="cut"/><rect x="34" y="4" width="10" height="10" class="cell"/></svg><span id="lab"></span></a>
  <h1 id="ttl"></h1>
  <nav id="rail"></nav>
  <div class="tools"><button type="button" id="fidb" class="fidb"></button><button type="button" id="reset" class="lnk"></button><button type="button" id="theme" class="round"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button></div>
</header>
<nav id="rungs" class="sr"></nav>
<div id="genes"></div>
<div id="marks"></div>
<aside id="lens" hidden></aside>
<section id="ctl" hidden></section>
<div id="pop" hidden></div>
