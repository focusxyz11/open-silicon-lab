<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The drawing and the line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,600;0,700;1,400&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap">
<style>:root{color-scheme:light dark;--bg:light-dark(#dfe8f2,#0b1120);--panel:light-dark(rgba(255,255,255,.86),rgba(16,23,38,.84));--solid:light-dark(#fff,#111a2b);--line:light-dark(rgba(40,60,90,.2),rgba(160,180,210,.22));--ink:light-dark(#16202e,#eef2f8);--muted:light-dark(#5b6a80,#9aa8bd);--accent:light-dark(#2f7de1,#5aa9ff);--on-accent:light-dark(#fff,#06101f);--bad:light-dark(#d8403a,#ff6b62);--warm:light-dark(#b86f0c,#ffb347);--sans:"Atkinson Hyperlegible Next",system-ui,sans-serif;--serif:"Besley",Georgia,serif;--mono:"Martian Mono",ui-monospace,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:92px;z-index:2;pointer-events:none;background:linear-gradient(var(--bg) 45%,transparent)}
#bar{position:fixed;z-index:5;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 18px}
.brand{display:flex;align-items:center;gap:8px;font:500 13px var(--sans);color:var(--muted)}.logo{width:22px;height:22px}.logo .fr{fill:none;stroke:#e5401a;stroke-width:5}.logo .cut{fill:none;stroke:var(--ink);stroke-width:4}.logo .cell{fill:#e5401a}
#ttl{margin:0 auto 0 8px;font:700 clamp(18px,1.7vw,26px)/1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body::after{content:"";position:fixed;left:0;top:0;bottom:0;width:230px;z-index:3;pointer-events:none;background:linear-gradient(90deg,var(--bg) 62%,transparent)}
.round{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center}
/* along: the stages of a chip's life, the one you stand at lit */
#along{position:fixed;z-index:5;top:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;max-width:calc(100vw - 16px);overflow-x:auto;border-bottom:1px solid var(--line)}
#along button,#along a{background:none;border:0;padding:7px 13px 9px;font:500 13.5px/1 var(--sans);color:var(--muted);white-space:nowrap;text-decoration:none;position:relative}
#along button:first-child{color:var(--accent)}#along button[aria-current=true]{color:var(--ink);font-weight:700}
#along button[aria-current=true]::after{content:"";position:absolute;left:50%;bottom:-4px;width:7px;height:7px;margin-left:-3.5px;background:var(--accent);transform:rotate(45deg)}
#along a{color:var(--accent);border-left:1px solid var(--line);margin-left:6px}
/* the spine: your stack's seven rungs; the ones this face holds are lit, and each says what it hands up */
#spine{position:fixed;z-index:4;left:14px;top:50%;transform:translateY(-50%);display:grid;gap:3px;width:164px}
#spine button{display:grid;gap:2px;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:6px 0 6px 10px;opacity:.5}
#spine button.in{opacity:1;border-left-color:var(--muted)}#spine button.on{border-left-color:var(--accent);border-left-width:4px;padding-left:8px}
#spine button:disabled{cursor:default}#spine b{font:700 15px/1.1 var(--serif)}#spine span{font:400 10.5px/1.25 var(--mono);font-stretch:80%;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--solid);border-radius:6px;padding:0 13px;min-height:38px;font:600 13.5px/1 var(--sans);white-space:nowrap}.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#foot{position:fixed;z-index:5;left:50%;bottom:12px;transform:translateX(-50%);width:min(1180px,calc(100vw - 20px));display:grid;gap:8px;justify-items:center;pointer-events:none}#foot>*{pointer-events:auto}
#say{margin:0;font-size:15px;text-align:center;text-wrap:balance;text-shadow:0 0 10px var(--bg),0 0 3px var(--bg);pointer-events:none}
#tools{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;justify-content:center;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lbl{font-size:12.5px;color:var(--muted)}.hint{font:italic 400 13px var(--serif);color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--solid);margin-left:-1px;padding:0 11px;min-height:36px;font:500 13px/1 var(--sans)}
.seg button:first-child{border-radius:5px 0 0 5px;margin-left:0}.seg button:last-child{border-radius:0 5px 5px 0}.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#prop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;max-width:820px}#prop span{font-size:14px}
#lens{position:fixed;z-index:6;right:22px;top:108px;width:min(400px,calc(100vw - 24px));background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--warm);border-radius:14px;padding:16px 18px}
#lens q{display:block;quotes:none;font:italic 400 19px/1.35 var(--serif)}#lens p{margin:9px 0 12px;font-size:14.5px}
@media (max-width:759px){body::after{display:none}.brand span{display:none}#ttl{font-size:15.5px}#along{left:0;transform:none;top:48px}#along button,#along a{padding:7px 9px 9px;font-size:12.5px}
 #spine{left:6px;top:92px;transform:none;display:flex;gap:0;width:calc(100vw - 12px);overflow-x:auto}#spine button{border-left:0;border-top:2px solid var(--line);padding:5px 8px 0 0;min-width:70px}#spine button.on{border-top:4px solid var(--accent);padding-left:0}#spine span{display:none}#spine b{font-size:13px}
 #say{font-size:13px}#tools{gap:8px;padding:8px}.seg button{padding:0 8px;font-size:12.5px}#lens{left:8px;right:8px;top:auto;bottom:8px;width:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
