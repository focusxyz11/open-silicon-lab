<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" role="img" aria-labelledby="t d">
  <title id="t">How a visitor and a contributor move</title>
  <desc id="d">Above: one visitor's way through five experiments in three worlds, by the moves try, turn and follow; a question appears alone after two strands of its world. Below: how a hole closes, from wanted to words to ready to live, and what each step asks for.</desc>
  <style>
    .bg { fill: #0b1120; } .card { fill: #111a2b; stroke: rgba(160,180,210,.24); } .ink { fill: #eef2f8; } .mut { fill: #9aa8bd; }
    .ar { stroke: rgba(160,180,210,.6); fill: none; stroke-width: 1.6; } .ah { fill: rgba(160,180,210,.75); } .hair { stroke: rgba(160,180,210,.2); }
    .fail { fill: #f0718a; } .make { fill: #ebc85e; } .open { fill: #6fe08a; } .halo { fill: none; stroke: #f0718a; stroke-width: 1.6; stroke-dasharray: 3 4; }
    .mv { fill: #5aa9ff; font-weight: 700; font-size: 13px; }
    .st { stroke: #9aa8bd; stroke-width: 1.8; fill: none; } .stf { fill: #9aa8bd; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .h { font: 700 19px Georgia, "Times New Roman", serif; } .q { font: 600 14px Georgia, "Times New Roman", serif; } .s { font-size: 13px; } .xs { font-size: 12px; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #dfe8f2; } .card { fill: #fff; stroke: rgba(40,60,90,.2); } .ink { fill: #16202e; } .mut { fill: #5b6a80; }
      .ar { stroke: rgba(40,60,90,.55); } .ah { fill: rgba(40,60,90,.7); } .hair { stroke: rgba(40,60,90,.16); }
      .fail { fill: #b3243f; } .make { fill: #8f6f00; } .open { fill: #1c8a54; } .halo { stroke: #b3243f; }
      .mv { fill: #2f7de1; } .st { stroke: #5b6a80; } .stf { fill: #5b6a80; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <rect class="bg" width="980" height="700" rx="16"/>

  <text class="h ink" x="36" y="46">No path: one visitor's way through</text>
  <text class="s mut" x="36" y="68">Every experiment is a front door. From each there are four ways on, the same four everywhere.</text>

  <g>
    <circle class="fail" cx="70" cy="128" r="9"/>
    <text class="q ink" x="90" y="124">Why does a bigger chip come out broken more often?</text>
    <text class="xs mut" x="90" y="142">arrives here from a link, and sees it through Copies</text>
    <path class="ar" d="M70 142 V196 Q70 208 82 208 H194" marker-end="url(#a)"/>
    <text class="mv" x="86" y="196">Try</text><text class="xs mut" x="118" y="196">a wider chip</text>
    <circle class="fail" cx="210" cy="208" r="9"/>
    <text class="q ink" x="230" y="204">How much speed do you give away to be safe</text>
    <text class="q ink" x="230" y="222">from the worst chip in a million?</text>
    <text class="xs mut" x="230" y="240">the same world, another strand</text>
    <path class="ar" d="M210 222 V292 Q210 304 222 304 H334" marker-end="url(#a)"/>
    <text class="mv" x="226" y="292">Turn</text><text class="xs mut" x="266" y="292">to the Line</text>
    <circle class="make" cx="350" cy="304" r="9"/>
    <text class="q ink" x="370" y="300">A fuller factory makes cheaper wafers, and slower ones. Where is the edge?</text>
    <text class="xs mut" x="370" y="318">another world, without leaving the wafer: now it is moving</text>
    <path class="ar" d="M350 318 V372 Q350 384 362 384 H474" marker-end="url(#a)"/>
    <text class="mv" x="366" y="372">Follow</text><text class="xs mut" x="422" y="372">the question</text>
    <circle class="make" cx="490" cy="384" r="9"/>
    <text class="q ink" x="510" y="380">Draw every chip directly, with no mask. What happens to the hours?</text>
    <text class="xs mut" x="510" y="398">not built yet: it says which engine it waits for</text>
    <path class="ar" d="M490 398 V452 Q490 464 502 464 H614" marker-end="url(#a)"/>
    <text class="mv" x="506" y="452">Turn</text><text class="xs mut" x="546" y="452">to Copies</text>
    <circle class="open" cx="630" cy="464" r="9"/>
    <text class="q ink" x="650" y="460">One set of masks, a thousand strangers.</text>
    <text class="q ink" x="650" y="478">What does each one pay?</text>
    <text class="xs mut" x="650" y="496">a third world, two moves from the lab's own record</text>
    <circle class="halo" cx="210" cy="208" r="16"/>
  </g>
  <g>
    <rect class="card" x="632" y="96" width="312" height="96" rx="12"/>
    <circle class="halo" cx="658" cy="122" r="9"/>
    <text class="xs mut" x="678" y="118">Two strands of one world: its question</text>
    <text class="xs mut" x="678" y="134">shows itself here, alone.</text>
    <text class="q ink" x="652" y="160">Why can a perfect design fail</text><text class="q ink" x="652" y="177">in the real world?</text>
  </g>
  <g>
    <text class="xs mut" x="36" y="392"><tspan class="mv">Deeper, higher</tspan>  along the lens you are in</text>
    <text class="xs mut" x="36" y="412"><tspan class="mv">Turn</tspan>  the same thing, another lens</text>
    <text class="xs mut" x="36" y="432"><tspan class="mv">Follow</tspan>  the same question, another experiment</text>
    <text class="xs mut" x="36" y="452"><tspan class="mv">Try</tspan>  change one thing, and the engine answers</text>
  </g>

  <line class="hair" x1="36" y1="520" x2="944" y2="520"/>
  <text class="h ink" x="36" y="556">How a hole closes</text>
  <text class="s mut" x="36" y="578">Every layer shows what it lacks. Anyone can take one step: a person, an AI agent, a search program. The engines and npm test decide.</text>

  <g transform="translate(0 626)">
    <circle class="st" cx="60" cy="0" r="9" stroke-dasharray="2 3"/>
    <text class="q ink" x="80" y="-4">Wanted</text><text class="xs mut" x="80" y="14">a named gap</text>
    <path class="ar" d="M176 0 H262" marker-end="url(#a)"/>
    <text class="xs mut" x="219" y="-10" text-anchor="middle">a case, a figure,</text><text class="xs mut" x="219" y="22" text-anchor="middle">an engine</text>

    <circle class="st" cx="290" cy="0" r="9"/>
    <text class="q ink" x="310" y="-4">Words</text><text class="xs mut" x="310" y="14">a question, a source</text>
    <path class="ar" d="M440 0 H526" marker-end="url(#a)"/>
    <text class="xs mut" x="483" y="-10" text-anchor="middle">an engine</text><text class="xs mut" x="483" y="22" text-anchor="middle">that can judge it</text>

    <circle class="st" cx="554" cy="0" r="9"/><path class="stf" d="M554 -9 A9 9 0 0 0 554 9 z"/>
    <text class="q ink" x="574" y="-4">Ready</text><text class="xs mut" x="574" y="14">numbers, no picture</text>
    <path class="ar" d="M704 0 H790" marker-end="url(#a)"/>
    <text class="xs mut" x="747" y="-10" text-anchor="middle">the experiment,</text><text class="xs mut" x="747" y="22" text-anchor="middle">built</text>

    <circle class="stf" cx="818" cy="0" r="9"/>
    <text class="q ink" x="838" y="-4">Live</text><text class="xs mut" x="838" y="14">run it, break it, ask</text>
  </g>
  <text class="xs mut" x="36" y="676">What is run, broken and asked goes on the record, and opens the next hole.</text>
</svg>
