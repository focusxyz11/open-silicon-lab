<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Map: The world around the chip: who does what, where, and who depends on whom">
<rect width="720" height="400" rx="14" fill="#0e1626"/>
<rect x="0" y="0" width="6" height="400" rx="3" fill="hsl(135 70% 58%)"/>
<text x="26" y="32" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="hsl(135 70% 58%)" font-weight="700" text-anchor="start" letter-spacing="0.12em">MAP</text>
<text x="26" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">The world around the chip: who does what, where, and who depends on whom</text>
<rect x="26" y="68" width="668" height="312" rx="10" fill="#152036" stroke="none" stroke-width="1"/><line x1="110" y1="150" x2="330" y2="210" stroke="#4a5d7d" stroke-width="2.5" stroke-linecap="round"/><line x1="110" y1="270" x2="110" y2="150" stroke="#4a5d7d" stroke-width="2.5" stroke-linecap="round"/><line x1="330" y1="100" x2="330" y2="210" stroke="#4a5d7d" stroke-width="2.5" stroke-linecap="round"/><line x1="330" y1="320" x2="330" y2="210" stroke="#d8504a" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="210" x2="520" y2="150" stroke="#4a5d7d" stroke-width="2.5" stroke-linecap="round"/><line x1="520" y1="150" x2="620" y2="260" stroke="#4a5d7d" stroke-width="2.5" stroke-linecap="round"/><line x1="520" y1="330" x2="330" y2="210" stroke="hsl(135 70% 58%)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/><line x1="110" y1="150" x2="520" y2="150" stroke="#4a5d7d" stroke-width="2.5" stroke-linecap="round"/><circle cx="110" cy="150" r="14" fill="#e6ecf5" opacity="0.9"/><text x="110" y="180" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Design houses</text><circle cx="110" cy="270" r="14" fill="#e6ecf5" opacity="0.9"/><text x="110" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Licensed blocks</text><circle cx="330" cy="210" r="14" fill="#e6ecf5" opacity="0.9"/><text x="330" y="240" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Factories</text><circle cx="330" cy="320" r="10" fill="#d8504a" opacity="1"/><text x="330" y="350" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">The printing machine: one maker</text><circle cx="330" cy="100" r="14" fill="#e6ecf5" opacity="0.9"/><text x="330" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Wafers and gases</text><circle cx="520" cy="150" r="14" fill="#e6ecf5" opacity="0.9"/><text x="520" y="180" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Packaging</text><circle cx="620" cy="260" r="14" fill="#e6ecf5" opacity="0.9"/><text x="620" y="290" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Phones, cars, data centres</text><circle cx="520" cy="330" r="14" fill="hsl(135 70% 58%)" opacity="1"/><text x="520" y="360" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Shared runs, open kits</text><text x="46" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">Close one place and watch what stops.</text><text x="46" y="118" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#d8504a" font-weight="600" text-anchor="start">The chain is as open as its narrowest link.</text>
</svg>
