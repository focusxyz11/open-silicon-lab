<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Plan: The ground divided into districts, and what flows between them">
<rect width="720" height="400" rx="14" fill="#0e1626"/>
<rect x="0" y="0" width="6" height="400" rx="3" fill="hsl(168 70% 58%)"/>
<text x="26" y="32" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="hsl(168 70% 58%)" font-weight="700" text-anchor="start" letter-spacing="0.12em">PLAN</text>
<text x="26" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">The ground divided into districts, and what flows between them</text>
<rect x="40" y="74" width="420" height="300" rx="8" fill="#152036" stroke="#2a3a57" stroke-width="1"/><rect x="60" y="94" width="110" height="90" rx="6" fill="#0e1626" stroke="#4a5d7d" stroke-width="1"/><text x="70" y="114" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">Cores</text><rect x="60" y="194" width="110" height="90" rx="6" fill="#0e1626" stroke="#4a5d7d" stroke-width="1"/><text x="70" y="214" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">Cores</text><rect x="190" y="94" width="150" height="190" rx="6" fill="hsla(168, 70%, 58%, 0.3)" stroke="hsl(168 70% 58%)" stroke-width="1"/><text x="200" y="114" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">AI unit</text><rect x="360" y="94" width="80" height="190" rx="6" fill="#0e1626" stroke="#4a5d7d" stroke-width="1"/><text x="370" y="114" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">Memory</text><rect x="60" y="304" width="380" height="50" rx="6" fill="#0e1626" stroke="#4a5d7d" stroke-width="1"/><text x="70" y="324" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">Links to the outside</text><path d="M 340 184 H 360" fill="none" stroke="hsl(168 70% 58%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M 265 284 V 304" fill="none" stroke="#f0a33a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><path d="M 170 139 H 190" fill="none" stroke="hsl(168 70% 58%)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M 170 239 H 190" fill="none" stroke="hsl(168 70% 58%)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><rect x="510" y="150" width="170" height="70" rx="6" fill="#0e1626" stroke="#4a5d7d" stroke-width="1"/><text x="522" y="176" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">Memory chips (far)</text><text x="522" y="196" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#f0a33a" font-weight="500" text-anchor="start">3,500× an add, per number</text><path d="M 460 329 C 490 329, 480 185, 510 185" fill="none" stroke="#f0a33a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="510" y="262" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">Each stream costs energy by</text><text x="510" y="278" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">how much it carries and how far.</text><text x="510" y="312" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="500" text-anchor="start">Redraw a boundary;</text><text x="510" y="328" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="500" text-anchor="start">watch who waits.</text><text x="40" y="392" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">3,500×: reading 16 bits from a memory chip against a 16-bit add, at 45 nm (Pedram et al.).</text>
</svg>
