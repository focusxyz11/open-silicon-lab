<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Clock: Time at every length, from a switch flipping to fifty years of chips">
<rect width="720" height="400" rx="14" fill="#0e1626"/>
<rect x="0" y="0" width="6" height="400" rx="3" fill="hsl(0 70% 58%)"/>
<text x="26" y="32" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="hsl(0 70% 58%)" font-weight="700" text-anchor="start" letter-spacing="0.12em">CLOCK</text>
<text x="26" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">Time at every length, from a switch flipping to fifty years of chips</text>
<line x1="80" y1="118" x2="640" y2="118" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><line x1="80" y1="112" x2="80" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="80" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#e6ecf5" font-weight="500" text-anchor="middle">a switch flips</text><line x1="159.24528301886792" y1="112" x2="159.24528301886792" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="159.24528301886792" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">one tick</text><line x1="238.49056603773585" y1="112" x2="238.49056603773585" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="238.49056603773585" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#e6ecf5" font-weight="500" text-anchor="middle">an instruction</text><line x1="317.7358490566038" y1="112" x2="317.7358490566038" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="317.7358490566038" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">a program</text><line x1="396.9811320754717" y1="112" x2="396.9811320754717" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="396.9811320754717" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#e6ecf5" font-weight="500" text-anchor="middle">a second</text><line x1="476.22641509433964" y1="112" x2="476.22641509433964" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><line x1="555.4716981132076" y1="112" x2="555.4716981132076" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="555.4716981132076" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#e6ecf5" font-weight="500" text-anchor="middle">a wafer's months</text><line x1="608.3018867924528" y1="112" x2="608.3018867924528" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="608.3018867924528" y="144" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">a chip's years</text><line x1="640" y1="112" x2="640" y2="124" stroke="#e6ecf5" stroke-width="1.5" stroke-linecap="round"/><text x="640" y="88" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#e6ecf5" font-weight="500" text-anchor="end">fifty years of chips</text><text x="80" y="168" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">seconds, ten times more at each step: 10⁻¹² to 10⁹</text><rect x="40" y="180" width="660" height="194" rx="10" fill="#152036" stroke="none" stroke-width="1"/><path d="M 60.0 342.0 L 356.7 244.4 L 540.0 193.2" fill="none" stroke="hsl(0 70% 58%)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="197.2" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="hsl(0 70% 58%)" font-weight="600" text-anchor="start">switches per chip</text><path d="M 60.0 346.8 L 356.7 250.8 L 540.0 244.4" fill="none" stroke="#5aa9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="248.39999999999998" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#5aa9ff" font-weight="600" text-anchor="start">clock speed</text><path d="M 60.0 198.0 L 417.8 321.2 L 540.0 327.6" fill="none" stroke="#f0a33a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="331.6" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#f0a33a" font-weight="600" text-anchor="start">cost per switch</text><line x1="356.72727272727275" y1="190" x2="356.72727272727275" y2="350" stroke="#4a5d7d" stroke-width="1" stroke-dasharray="3 4" stroke-linecap="round"/><text x="362.72727272727275" y="342" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">around 2005: smaller stops meaning cooler</text><text x="60" y="362" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">1971</text><text x="225.8181818181818" y="362" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">1990</text><text x="356.72727272727275" y="362" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">2005</text><text x="540" y="362" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">2026</text><text x="40" y="392" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">The shapes of the lines are a sketch; the engine will draw them from sourced figures.</text>
</svg>
