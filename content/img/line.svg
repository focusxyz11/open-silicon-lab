-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">added atoms</text><rect x="476" y="334" width="14" height="14" rx="3" fill="hsl(46 70% 58%)" stroke="none" stroke-width="1"/><text x="496" y="345" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">gate</text><rect x="586" y="334" width="14" height="14" rx="3" fill="#c9a14a" stroke="none" stroke-width="1"/><text x="606" y="345" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">metal</text><text x="30" y="384" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">A thousand steps or more go round this loop of lay down, print, carve, clean, once for every layer.</text>
