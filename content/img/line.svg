<text x="72" y="92" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="600" text-anchor="middle">1. Crystal</text><rect x="30" y="240" width="84" height="60" rx="2" fill="#3a4c6a" stroke="none" stroke-width="1"/><path d="M 116 270 l 8 0" fill="none" stroke="#4a5d7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="92" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="600" text-anchor="middle">2. Film</text><rect x="126" y="240" width="84" height="60" rx="2" fill="#3a4c6a" stroke="none" stroke-width="1"/><rect x="126" y="228" width="84" height="12" rx="1" fill="#7f9bc0" stroke="none" stroke-width="1"/><path d="M 212 270 l 8 0" fill="none" stroke="#4a5d7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="264" y="92" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="600" text-anchor="middle">3. Print</text><rect x="222" y="240" width="84" height="60" rx="2" fill="#3a4c6a" stroke="none" stroke-width="1"/><rect x="222" y="228" width="84" height="12" rx="1" fill="#7f9bc0" stroke="none" stroke-width="1"/><rect x="222" y="216" width="29.4" height="12" rx="1" fill="#c58b2c" stroke="none" stroke-width="1"/><rect x="276.6" y="216" width="29.4" height="12" rx="1" fill="#c58b2c" stroke="none" stroke-width="1"/><line x1="264" y1="170" x2="264" y2="210" stroke="#e6ecf5" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round"/><path d="M 308 270 l 8 0" fill="none" stroke="#4a5d7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="92" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="600" text-anchor="middle">4. Etch</text><rect x="318" y="240" width="84" height="60" rx="2" fill="#3a4c6a" stroke="none" stroke-width="1"/><rect x="318" y="228" width="