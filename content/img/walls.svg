<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Walls: Everything a chip could be, as open ground, and the walls of each kind around it">
<rect width="720" height="400" rx="14" fill="#0e1626"/>
<rect x="0" y="0" width="6" height="400" rx="3" fill="hsl(305 70% 58%)"/>
<text x="26" y="32" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="hsl(305 70% 58%)" font-weight="700" text-anchor="start" letter-spacing="0.12em">WALLS</text>
<text x="26" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">Everything a chip could be, as open ground, and the walls of each kind around it</text>
<rect x="26" y="68" width="668" height="312" rx="10" fill="#152036" stroke="none" stroke-width="1"/><path d="M 180 240 A 70 56 0 0 1 320 240" fill="none" stroke="#f0a33a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="155" y="167" width="190" height="16" rx="3" fill="#152036" stroke="none" stroke-width="1"/><text x="250" y="179" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#f0a33a" font-weight="600" text-anchor="middle">Cost, habit, missing ideas</text><path d="M 130 240 A 120 96 0 0 1 370 240" fill="none" stroke="hsl(305 70% 58%)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="155" y="127" width="190" height="16" rx="3" fill="#152036" stroke="none" stroke-width="1"/><text x="250" y="139" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="hsl(305 70% 58%)" font-weight="600" text-anchor="middle">Problems that double with each item</text><path d="M 82 240 A 168 134.4 0 0 1 418 240" fill="none" stroke="#5aa9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="155" y="88.6" width="190" height="16" rx="3" fill="#152036" stroke="none" stroke-width="1"/><text x="250" y="100.6" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5aa9ff" font-weight="600" text-anchor="middle">Light in one tick</text><line x1="46" y1="360" x2="676" y2="360" stroke="#e6ecf5" stroke-width="2.5" stroke-linecap="round"/><text x="56" y="352" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">The energy floor (kT ln 2): today's chips sit millions of times above it</text><rect x="560" y="92" width="116" height="120" rx="8" fill="hsla(305, 70%, 58%, 0.12)" stroke="hsl(305 70% 58%)" stroke-width="1.5"/><text x="618" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">Questions no</text><text x="618" y="156" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="middle">machine can settle</text><text x="618" y="178" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="middle">mathematics, 1936</text><circle cx="250" cy="240" r="16" fill="hsl(305 70% 58%)"/><text x="250" y="274" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="600" text-anchor="middle">Today's chips</text><path d="M 198 240 A 52 42 0 0 1 302 240" fill="none" stroke="#f0a33a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4" opacity="0.6"/><text x="272" y="260" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#f0a33a" font-weight="500" text-anchor="start">a wall that moved</text><text x="470" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="600" text-anchor="start">Kinds of wall:</text><text x="470" y="268" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">physics: solid</text><text x="470" y="284" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">mathematics: solid</text><text x="470" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">money and habit: dashed, dated;</text><text x="470" y="316" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">some of them fell</text>
</svg>
