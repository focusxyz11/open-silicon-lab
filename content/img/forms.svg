<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Forms: One design in every form it takes, at once, tied together">
<rect width="720" height="400" rx="14" fill="#0e1626"/>
<rect x="0" y="0" width="6" height="400" rx="3" fill="hsl(24 70% 58%)"/>
<text x="26" y="32" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="hsl(24 70% 58%)" font-weight="700" text-anchor="start" letter-spacing="0.12em">FORMS</text>
<text x="26" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">One design in every form it takes, at once, tied together</text>
<rect x="30" y="72" width="210" height="146" rx="10" fill="#152036" stroke="none" stroke-width="1"/><text x="44" y="94" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="600" text-anchor="start">The job</text><text x="44" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">Two bits in;</text><text x="44" y="150" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">their sum and carry out.</text><text x="44" y="186" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">said by a person</text><rect x="256" y="72" width="210" height="146" rx="10" fill="#152036" stroke="none" stroke-width="1"/><text x="270" y="94" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="600" text-anchor="start">Description</text><text x="270" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="hsl(24 70% 58%)" font-weight="600" text-anchor="start">sum   = a ^ b;</text><text x="270" y="152" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#e6ecf5" font-weight="500" text-anchor="start">carry = a &amp; b;</text><text x="270" y="186" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">written by a person or an AI</text><rect x="482" y="72" width="210" height="146" rx="10" fill="#152036" stroke="none" stroke-width="1"/><text x="496" y="94" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="600" text-anchor="start">What it does</text><text x="496" y="116" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#8a9bb5" font-weight="500" text-anchor="start">a b  sum carry</text><text x="496" y="133" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="500" text-anchor="start">0 0   0    0</text><text x="496" y="150" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="500" text-anchor="start">0 1   1    0</text><text x="496" y="167" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="500" text-anchor="start">1 0   1    0</text><text x="496" y="184" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="500" text-anchor="start">1 1   0    1</text><rect x="530" y="104" width="30" height="88" rx="4" fill="none" stroke="hsl(24 70% 58%)" stroke-width="1.5"/><rect x="30" y="232" width="210" height="146" rx="10" fill="#152036" stroke="none" stroke-width="1"/><text x="44" y="254" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="600" text-anchor="start">Gates</text><rect x="114" y="274" width="44" height="28" rx="6" fill="none" stroke="hsl(24 70% 58%)" stroke-width="2"/><text x="136" y="293" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="hsl(24 70% 58%)" font-weight="700" text-anchor="middle">XOR</text><rect x="114" y="316" width="44" height="28" rx="6" fill="none" stroke="#e6ecf5" stroke-width="1.5"/><text x="136" y="335" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#e6ecf5" font-weight="700" text-anchor="middle">AND</text><line x1="44" y1="282" x2="114" y2="282" stroke="#4a5d7d" stroke-width="1" stroke-linecap="round"/><line x1="44" y1="326" x2="114" y2="326" stroke="#4a5d7d" stroke-width="1" stroke-linecap="round"/><line x1="158" y1="288" x2="224" y2="288" stroke="hsl(24 70% 58%)" stroke-width="2" stroke-linecap="round"/><line x1="158" y1="330" x2="224" y2="330" stroke="#4a5d7d" stroke-width="1" stroke-linecap="round"/><text x="44" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">chosen by a program: 2 gates, 18 switches</text><rect x="256" y="232" width="210" height="146" rx="10" fill="#152036" stroke="none" stroke-width="1"/><text x="270" y="254" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="600" text-anchor="start">Layout</text><rect x="284" y="276" width="70" height="50" rx="3" fill="hsla(24, 70%, 58%, 0.35)" stroke="hsl(24 70% 58%)" stroke-width="1"/><rect x="372" y="276" width="70" height="50" rx="3" fill="#2a3a57" stroke="#4a5d7d" stroke-width="1"/><path d="M 320 326 V 344 H 420 V 326" fill="none" stroke="#4a5d7d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">placed by a program</text><rect x="482" y="232" width="210" height="146" rx="10" fill="#152036" stroke="none" stroke-width="1"/><text x="496" y="254" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#e6ecf5" font-weight="600" text-anchor="start">Masks</text><rect x="496" y="272" width="120" height="64" rx="3" fill="#152036" stroke="#4a5d7d" stroke-width="1"/><rect x="508" y="278" width="120" height="64" rx="3" fill="#152036" stroke="#4a5d7d" stroke-width="1"/><rect x="520" y="284" width="120" height="64" rx="3" fill="#152036" stroke="#4a5d7d" stroke-width="1"/><rect x="532" y="290" width="120" height="64" rx="3" fill="hsla(24, 70%, 58%, 0.28)" stroke="hsl(24 70% 58%)" stroke-width="1"/><text x="496" y="368" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#8a9bb5" font-weight="500" text-anchor="start">26 masks, one for each layer</text><text x="30" y="392" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a9bb5" font-weight="500" text-anchor="start">Touch "sum" in any form and it lights in all six: its line, its column, its gate, its cell, its shape on the masks.</text>
</svg>
